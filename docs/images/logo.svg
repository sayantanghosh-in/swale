<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 340" width="1460" height="340" role="img" aria-label="swale — a local-first assistant for your terminal">
  <title>swale</title>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BC4F1"/>
      <stop offset="100%" stop-color="#2B7FA8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97D09"/>
      <stop offset="50%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#F97D09"/>
    </linearGradient>
    <!-- The open channel, so water can only sit where a swale would hold it. -->
    <clipPath id="channel">
      <path d="M150 118 C205 118 210 232 265 232 L395 232 C450 232 455 118 510 118 Z"/>
    </clipPath>
  </defs>

  <rect width="1460" height="340" rx="24" fill="#11111b"/>

  <!-- rain, falling into the dip -->
  <g stroke="#3FA7D6" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="214" y1="44" x2="206" y2="76"/>
    <line x1="286" y1="30" x2="278" y2="66"/>
    <line x1="358" y1="46" x2="350" y2="78"/>
    <line x1="430" y1="30" x2="422" y2="66"/>
  </g>

  <!-- water, held by the channel -->
  <g clip-path="url(#channel)">
    <rect x="150" y="186" width="360" height="60" fill="url(#water)" opacity="0.38"/>
    <g stroke="#7FD4F5" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M258 202 q19 -13 38 0 t38 0 t38 0"/>
      <path d="M278 222 q19 -13 38 0 t38 0"/>
    </g>
  </g>

  <!-- the swale: ground sloping in from both sides -->
  <path d="M40 118 L150 118 C205 118 210 232 265 232 L395 232 C450 232 455 118 510 118 L620 118"
        fill="none" stroke="url(#ground)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- grass on the banks -->
  <g stroke="#4FA355" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M74 112 v-28 M61 112 q3 -21 -8 -32 M87 112 q-3 -21 8 -32"/>
    <path d="M124 112 v-21 M113 112 q3 -17 -6 -25 M135 112 q-3 -17 6 -25"/>
    <path d="M538 112 v-28 M525 112 q3 -21 -8 -32 M551 112 q-3 -21 8 -32"/>
    <path d="M588 112 v-21 M577 112 q3 -17 -6 -25 M599 112 q-3 -17 6 -25"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="700" y="146" font-size="84" font-weight="700" letter-spacing="14" fill="#F97D09">swale</text>
    <rect x="703" y="176" width="690" height="3" rx="1.5" fill="#33333f"/>
    <text x="703" y="220" font-size="26" fill="#9aa0ab">a local-first assistant for your terminal</text>
    <text x="703" y="264" font-size="24" fill="#5f6672">tasks · notes · spending · GitHub · LeetCode</text>
  </g>
</svg>
